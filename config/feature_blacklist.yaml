leakage_features:
  # ============================
  # Target & direct leakage
  # ============================
  - target_log_price
  - sale price
  - sale_price
  - sale_price_num
  - log_sale_price

  # ============================
  # PLUTO assessment leakage — 2026 snapshot values encode historical price appreciation
  # These fields originate from the PLUTO 2026 snapshot and leak future assessment information
  # into historical sales features. They must be excluded from model training.
  # ============================
  - assesstot
  - exempttot
  - assessland
  - appbbl
  - taxmap
  - plutomapid

  # ============================
  # Temporal identifiers (split-only)
  # ============================
  - sale date
  - sale_date
  - sale_year
  - sale_month
  - sale_quarter
  - sale_day
  - sale_timestamp

  # ============================
  # Administrative date fields
  # ============================
  - basempdate
  - dcasdate
  - edesigdate
  - landmkdate
  - masdate
  - polidate
  - rpaddate
  - zoningdate
  - appdate

  # ============================
  # Post-sale identifiers / row keys
  # ============================
  - bin
  - bbl
  - lot
  - block
  - taxlot
  - record_id
  - sale_id

  # Parcel-identifier artifact of the sales/PLUTO merge-suffix collision (both
  # raw source files carry a column named BBL; pandas' default merge suffixing
  # in rebuild_canonical.py preserves PLUTO's copy as BBL_pluto instead of
  # discarding it). Not a genuine structural or locational feature;
  # blacklisted 2026-09, see VERIFICATION_REPORT.md Round 7.
  - BBL_pluto

  # ============================
  # Duplicate / raw geo fields
  # ============================
  - latitude
  - longitude
  - xcoord
  - ycoord

  # ============================
  # Raw ideology / election variables
  # (ONLY included in political models)
  # ============================
  - district_ideology
  - weighted_dem
  - weighted_rep
  - dem_vote_share
  - rep_vote_share
  - turnout

  # ============================
  # Derived target encodings (forbidden)
  # ============================
  - mean_price
  - borough_mean_price
  - council_district_mean_price
  - building class category_mean_price

  # 100% null features — contribute zero signal, waste model capacity
  - EASE-MENT

  # ============================
  # v2 ideology measures & sample flags (Round 12)
  # Analysis-side additions merged into the canonical dataset by
  # rebuild_canonical.py. The trained models (whose metrics the paper
  # reports) never saw these columns; blacklisting them keeps every
  # future training run on the exact legacy feature set.
  # ============================
  - dem_share_mayor_allcand
  - dem_share_pres
  - dem_share_vintage
  - dem_share_mayor_allcand_vintage
  - dem_share_pres_vintage
  - election_year_pres
  - sample_pre2024
  - is_resid_tc12
  - price_ge_100k
  - multi_parcel_flag
  - building_class_category

  # ============================
  # Round 13 area-weighted / dominant-district ideology measures
  # Split-ED double-counting fix: area-weighted (_aw) and dominant-district
  # (_dom) versions of the six ideology measures, added to
  # modeling_dataset_canonical_v3.parquet by
  # src/data_pipeline/build_ideology_scores_v3.py. The trained models are
  # untouched; blacklisting keeps every future training run on the exact
  # legacy feature set.
  # ============================
  - dem_share_aw
  - dem_share_mayor_allcand_aw
  - dem_share_pres_aw
  - dem_share_vintage_aw
  - dem_share_mayor_allcand_vintage_aw
  - dem_share_pres_vintage_aw
  - dem_share_vintage_dom
  - dem_share_mayor_allcand_vintage_dom
  - dem_share_pres_vintage_dom
