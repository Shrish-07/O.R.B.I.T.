name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run smoke check
        run: |
          python src/ci_smoke_check.py

  sanity-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas pyarrow fastparquet lightgbm scikit-learn; fi

      - name: Check canonical dataset availability
        id: check_data
        run: |
          if [ -f "data/canonical/modeling_dataset_canonical_v2.parquet" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::data/canonical/modeling_dataset_canonical_v2.parquet is gitignored and not present in CI checkout. Skipping pipeline sanity/smoke steps. Run this job locally with real data, or add a data-fetch step to this workflow if you want it enforced in CI."
          fi

      - name: Run pipeline sanity check
        if: steps.check_data.outputs.exists == 'true'
        run: python src/pipeline_sanity_check.py

      - name: Generate splits
        if: steps.check_data.outputs.exists == 'true'
        run: python src/split_temporal.py

      - name: Run smoke training
        if: steps.check_data.outputs.exists == 'true'
        run: python models/training/train_smoke.py

      - name: Upload smoke result
        if: steps.check_data.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: experiments/results/smoke_train_result.json
